<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Facts Practice · Tools</title>
<script src="/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/global.css">
<link rel="stylesheet" href="styles.css">
</head>
<!-- #app is entirely JS-rendered (see app.js render()) — setup/practice/
     results/dashboard are all one template re-rendered on every state
     change, same structure as Life Goals Calendar. mathFactsCore.js holds
     the pure fact-generation/scoring/mastery logic and is also require()'d
     directly by test/mathFacts.test.js, so it's loaded before app.js. -->
<body data-tool="math-facts">

<div id="tools-nav-root"></div>

<header class="tools-status-bar">
  <div class="tools-status-bar-id">
    <span class="tools-status-dot" id="mf-status-dot"></span>
    <span class="tools-status-label">math-facts</span>
  </div>
  <div class="tools-status-right" id="mf-status-right">idle</div>
</header>

<div class="mf-wrap">
  <div id="app"></div>
</div>

<script src="mathFactsCore.js"></script>
<script src="/nav.js"></script>
<script src="app.js"></script>
</body>
</html>
