<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/global.css">
</head>
<body data-tool="">

<div id="tools-nav-root"></div>

<main class="tools-home-main">
  <div class="tools-home-eyebrow">local tool suite</div>
  <h1 class="tools-home-title">Tools</h1>
  <p class="tools-home-sub">Pick a tool to get started.</p>

  <div id="tools-grid"></div>
</main>

<script src="/nav.js"></script>
<script>
  (function () {
    "use strict";
    var root = document.getElementById("tools-grid");
    var tools = window.ToolsRegistry || [];

    if (!tools.length) {
      root.innerHTML = '<p class="tools-empty">No tools registered yet.</p>';
      return;
    }

    function cardHtml(tool) {
      return '<a class="tools-card" href="' + tool.href + '">' +
        '<div class="tools-card-title">' + tool.label + '</div>' +
        '<div class="tools-card-desc">' + tool.description + '</div>' +
        '</a>';
    }

    // Tools without a category render first, ungrouped. Categorized tools
    // are grouped under a heading, in order of each category's first
    // appearance in the registry.
    var uncategorized = tools.filter(function (t) { return !t.category; });
    var categories = [];
    tools.forEach(function (t) {
      if (t.category && categories.indexOf(t.category) === -1) categories.push(t.category);
    });

    var html = "";
    if (uncategorized.length) {
      html += '<div class="tools-grid">' + uncategorized.map(cardHtml).join("") + "</div>";
    }
    categories.forEach(function (cat) {
      var items = tools.filter(function (t) { return t.category === cat; });
      html += '<div class="tools-category">' +
        '<div class="tools-category-heading">' + cat + "</div>" +
        '<div class="tools-grid">' + items.map(cardHtml).join("") + "</div>" +
        "</div>";
    });

    root.innerHTML = html;
  })();
</script>
</body>
</html>
